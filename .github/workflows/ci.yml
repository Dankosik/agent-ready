name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Add Homebrew to PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          brew bundle --file Brewfile
          brew bundle --file languages/go/Brewfile
      - name: Check scripts and Brewfiles
        run: |
          bash -n bootstrap.sh install.sh test-install.sh verify.sh languages/go/install.sh languages/go/verify.sh
          shellcheck bootstrap.sh install.sh test-install.sh verify.sh languages/go/install.sh languages/go/verify.sh
          actionlint
          gitleaks dir --redact .
          gitleaks git --redact .
          brew bundle check --file Brewfile
          brew bundle check --file languages/go/Brewfile
      - name: Verify behavior
        run: |
          ./test-install.sh
          ./verify.sh

  wsl:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up WSL2
        shell: pwsh
        run: |
          wsl --set-default-version 2
          wsl --install --distribution Ubuntu-24.04 --no-launch
          wsl --set-default Ubuntu-24.04
          wsl --distribution Ubuntu-24.04 --user root -- bash -lc "apt-get update && apt-get install -y --no-install-recommends curl jq ripgrep"
          wsl --list --verbose
      - name: Verify behavior in WSL2
        shell: pwsh
        run: |
          $repo = "/mnt/$($env:GITHUB_WORKSPACE.Substring(0, 1).ToLower())/$($env:GITHUB_WORKSPACE.Substring(3).Replace('\', '/'))"
          wsl --distribution Ubuntu-24.04 --user root -- bash -lc "cd '$repo' && bash -n bootstrap.sh install.sh test-install.sh languages/go/install.sh && ./test-install.sh"
