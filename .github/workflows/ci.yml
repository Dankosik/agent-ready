name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add Homebrew to PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          brew bundle --file Brewfile
          brew bundle --file languages/go/Brewfile
      - name: Check scripts and Brewfiles
        run: |
          bash -n bootstrap.sh install.sh test-install.sh verify.sh languages/go/install.sh languages/go/verify.sh
          shellcheck bootstrap.sh install.sh test-install.sh verify.sh languages/go/install.sh languages/go/verify.sh
          actionlint
          brew bundle check --file Brewfile
          brew bundle check --file languages/go/Brewfile
      - name: Verify behavior
        run: |
          ./test-install.sh
          ./verify.sh
